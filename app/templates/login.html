<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DormChef — Log in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
<main class="page-wrap" role="main">
  <header class="onboarding-header">
    <a href="/" class="back-arrow" aria-label="Go back">&#8592;</a>
    <div class="logo">DormChef</div>
  </header>

  <h1 class="auth-heading">Start planning smarter meals</h1>

  <div class="auth-card">
    <div class="auth-label">Log in</div>
    <img src="{{ url_for('static', filename='images/avatar.png') }}" class="auth-avatar" alt="">

    <input type="email" class="auth-input" name="email" placeholder="Email...">
    <input type="password" class="auth-input" name="password" placeholder="Password...">

    <p class="auth-footer">Don&rsquo;t have an account? <a href="/signup" class="auth-link">Sign up</a></p>
  </div>
</main>
</body>
</html>
