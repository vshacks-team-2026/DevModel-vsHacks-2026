<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DormChef — Favorites</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-authenticated="true">
<main class="onboard-card" role="main">
  <header class="onboarding-header">
    <a href="/onboarding" class="back-arrow" aria-label="Go back">&#8592;</a>
    <div class="logo">DormChef</div>
  </header>

  <div class="panel">
    <h2 class="favorites-heading">Your favorite meals</h2>

    <div class="favorites-list">
      {% for meal in favorites %}
      <details class="meal-card" style="--recipe-bg:url('{{ url_for('static', filename='images/cuisine-' ~ meal.cuisine|lower ~ '.png') }}')">
        <summary>
          <div class="meal-summary-left">
            <span class="meal-title">{{ meal.name }}</span>
            <span class="meal-cuisine">{{ meal.cuisine }}</span>
          </div>
          <button type="button" class="fav-star favorited" aria-label="Remove from favorites" data-favorite-id="{{ meal.id }}">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
          </button>
        </summary>
        <div class="meal-body">
          <p class="meal-label">Ingredients:</p>
          <ul>
            {% for item in meal.ingredients %}
            <li>{{ item }}</li>
            {% endfor %}
          </ul>
          {% for step in meal.steps %}
          <p class="meal-label">Step {{ loop.index }}:</p>
          <p>{{ step }}</p>
          {% endfor %}
        </div>
      </details>
      {% endfor %}
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="/onboarding" class="nav-btn" aria-label="This week's plan">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
    </a>
    <button type="button" class="nav-btn active" aria-label="Favorites">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
    </button>
    <a href="/profile" class="nav-btn nav-account" aria-label="Account">
      <img src="{{ url_for('static', filename='images/avatar.png') }}" alt="">
    </a>
  </nav>
</main>

<script src="{{ url_for('static', filename='plan.js') }}"></script>
</body>
</html>
